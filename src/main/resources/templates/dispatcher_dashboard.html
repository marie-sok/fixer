<!DOCTYPE html>
<html>
<head>

    <title>Fixer Dispatcher</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        table{
            border-collapse: collapse;
            width:100%;
        }

        th,td{
            border:1px solid #ddd;
            padding:8px;
        }

        th{
            background:#f3f3f3;
        }

        button{
            padding:6px 10px;
        }

    </style>

</head>

<body>

<h2>Create Request</h2>

<form id="requestForm">

    <input placeholder="Client name" name="clientName">

    <input placeholder="Phone" name="phone">

    <input placeholder="Address" name="address">

    <input placeholder="Description" name="description">

    <button type="submit">Create</button>

</form>

<hr>

<h2>Requests</h2>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>Client</th>
        <th>Address</th>
        <th>Description</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody id="requestsTable"></tbody>

</table>


<script>

    async function loadRequests(){

        const res = await fetch("/api/requests?status=NEW");

        const data = await res.json();

        const table = document.getElementById("requestsTable");

        table.innerHTML = "";

        data.forEach(r=>{

            const row = `
            <tr>
                <td>${r.id}</td>
                <td>${r.clientName}</td>
                <td>${r.address}</td>
                <td>${r.description}</td>
                <td>${r.status}</td>
                <td>
                    <button onclick="take(${r.id})">
                        Take
                    </button>
                </td>
            </tr>
            `;

            table.innerHTML += row;

        });

    }

    async function take(id){

        await fetch("/take/"+id+"/1",{method:"POST"});

        loadRequests();

    }

    document
    .getElementById("requestForm")
    .addEventListener("submit", async (e)=>{

        e.preventDefault();

        const form = e.target;

        const data = {

            clientName:form.clientName.value,
            phone:form.phone.value,
            address:form.address.value,
            description:form.description.value

        };

        await fetch("/api/requests",{

            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(data)

        });

        form.reset();

        loadRequests();

    });

    loadRequests();

</script>

</body>
</html>
