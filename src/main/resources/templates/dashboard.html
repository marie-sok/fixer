<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fixer Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f6f7fb;
            color: #2d2d2d;
        }

        .container {
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Карточки */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .NEW { background: #e0f0ff; }
        .IN_PROGRESS { background: #fff4cc; }
        .DONE { background: #d4f8d4; }

        button {
            margin-top: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #6c8cff;
            color: white;
        }

        /* форма */
        .form {
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        input {
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        /* чат */
        .chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .chat-box {
            width: 260px;
            height: 320px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
        }

        .chat-header {
            padding: 10px;
            background: #6c8cff;
            color: white;
            border-radius: 16px 16px 0 0;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            font-size: 13px;
        }

        .chat-input {
            display: flex;
        }

        .chat-input input {
            flex: 1;
            border: none;
            padding: 10px;
        }

        .chat-toggle {
            background: #6c8cff;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🛠 Fixer Dashboard</h1>

    <div class="form">
        <h3>Создать заявку</h3>
        <input id="name" placeholder="Имя клиента">
        <input id="phone" placeholder="Телефон">
        <input id="address" placeholder="Адрес">
        <input id="desc" placeholder="Проблема">
        <button onclick="createRequest()">Создать</button>
    </div>

    <div class="grid" id="requests"></div>

</div>

<div class="chat">
    <button class="chat-toggle" onclick="toggleChat()">💬</button>

    <div class="chat-box" id="chatBox">
        <div class="chat-header">Поддержка</div>
        <div class="chat-messages" id="messages">
            Привет! Чем помочь?
        </div>
        <div class="chat-input">
            <input id="msg" placeholder="Сообщение...">
            <button onclick="send()">→</button>
        </div>
    </div>
</div>

<script>

    async function loadRequests() {
        const res = await fetch('/requests');
        const data = await res.json();

        const container = document.getElementById('requests');
        container.innerHTML = '';

        data.forEach(r => {
            container.innerHTML += `
                <div class="card">
                    <div class="status ${r.status}">${r.status}</div>
                    <h3>${r.clientName}</h3>
                    <p>${r.description}</p>
                    <p>${r.address}</p>
                    <button onclick="take(${r.id})">Взять</button>
                </div>
            `;
        });
    }

    async function createRequest() {
        await fetch('/requests', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                clientName: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                description: document.getElementById('desc').value
            })
        });

        loadRequests();
    }

    async function take(id) {
        await fetch('/requests/take/' + id, { method: 'POST' });
        loadRequests();
    }

    function toggleChat() {
        const box = document.getElementById('chatBox');
        box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function send() {
        const msg = document.getElementById('msg').value;
        const messages = document.getElementById('messages');
        messages.innerHTML += `<div>Вы: ${msg}</div>`;
        document.getElementById('msg').value = '';
    }

    loadRequests();

</script>

</body>
</html>
