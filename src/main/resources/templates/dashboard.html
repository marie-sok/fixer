<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fixer - Modern Minimal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
          background: linear-gradient(135deg, #FFFAF0 0%, #E0F7FA 100%);
        }
        .card {
          background: rgba(255,255,255,0.8);
          backdrop-filter: blur(10px);
          border-radius: 1rem;
          box-shadow: 0 4px 15px rgba(0,0,0,0.1);
          transition: transform 0.3s;
        }
        .card:hover {
          transform: translateY(-5px);
        }
        .status-badge {
          padding: 0.2rem 0.6rem;
          border-radius: 0.5rem;
          font-weight: 600;
          font-size: 0.85rem;
        }
        #chatSupport {
          backdrop-filter: blur(8px);
          border-radius: 1rem;
          box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="font-sans text-gray-700 min-h-screen">

<!-- HEADER -->
<header class="max-w-6xl mx-auto px-6 py-8 flex flex-col items-center">
    <h1 class="text-4xl font-extrabold text-blue-700 drop-shadow-lg"><i class="fa-solid fa-wrench"></i> Fixer</h1>
    <p class="mt-2 text-gray-600">Ремонт и сервис с комфортом</p>
</header>

<!-- PROMO -->
<div class="max-w-6xl mx-auto px-6 mb-8">
    <div class="card text-center py-4 text-blue-800 font-bold text-lg">
        🎁 Новым клиентам первый вызов бесплатно!
    </div>
</div>

<!-- MAIN GRID -->
<main class="max-w-6xl mx-auto px-6 grid md:grid-cols-3 gap-6">

    <!-- CREATE REQUEST -->
    <div class="card p-6 flex flex-col gap-4">
        <h2 class="text-xl font-semibold text-blue-700"><i class="fa-solid fa-plus"></i> Создать заявку</h2>
        <form id="requestForm" class="flex flex-col gap-3">
            <input type="text" name="clientName" placeholder="Имя клиента" class="border p-2 rounded-md">
            <input type="text" name="phone" placeholder="Телефон" class="border p-2 rounded-md">
            <input type="text" name="address" placeholder="Адрес" class="border p-2 rounded-md">
            <textarea name="description" placeholder="Описание проблемы" class="border p-2 rounded-md"></textarea>
            <button class="bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-md transition-colors">Создать</button>
        </form>
    </div>

    <!-- REQUESTS TABLE -->
    <div class="col-span-2 card p-6 overflow-x-auto">
        <h2 class="text-xl font-semibold text-blue-700 mb-4"><i class="fa-solid fa-list"></i> Активные заявки</h2>
        <table class="w-full table-auto text-sm">
            <thead>
            <tr class="text-left text-gray-500">
                <th class="px-3 py-2">ID</th>
                <th class="px-3 py-2">Клиент</th>
                <th class="px-3 py-2">Адрес</th>
                <th class="px-3 py-2">Описание</th>
                <th class="px-3 py-2">Статус</th>
                <th class="px-3 py-2">Мастер</th>
                <th class="px-3 py-2">Действия</th>
            </tr>
            </thead>
            <tbody id="requestsTable" class="divide-y divide-gray-200"></tbody>
        </table>
    </div>

</main>

<!-- CHAT SUPPORT -->
<div id="chatSupport" class="fixed bottom-6 right-6 w-80 hidden flex-col">
    <div id="chatHeader" class="bg-blue-600 text-white p-3 rounded-t cursor-pointer flex justify-between items-center">
        <span><i class="fa-solid fa-comments"></i> Поддержка</span>
        <i id="chatToggleIcon" class="fa-solid fa-chevron-up"></i>
    </div>
    <div id="chatBody" class="flex flex-col h-64 bg-white hidden border border-gray-200">
        <div id="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
        <div class="flex p-3 gap-2 border-t border-gray-200">
            <input id="chatInput" type="text" placeholder="Напишите сообщение..." class="flex-1 border rounded p-2">
            <button id="chatSend" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">Отправить</button>
        </div>
    </div>
</div>

<script>
    const chatHeader = document.getElementById("chatHeader");
    const chatBody = document.getElementById("chatBody");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const chatSend = document.getElementById("chatSend");
    const chatToggleIcon = document.getElementById("chatToggleIcon");

    chatHeader.addEventListener("click", () => {
        chatBody.classList.toggle("hidden");
        chatToggleIcon.classList.toggle("fa-chevron-up");
        chatToggleIcon.classList.toggle("fa-chevron-down");
    });

    chatSend.addEventListener("click", () => {
        const msg = chatInput.value.trim();
        if(!msg) return;
        const msgEl = document.createElement("div");
        msgEl.className = "text-gray-800 bg-gray-100 p-2 rounded self-end";
        msgEl.textContent = msg;
        chatMessages.appendChild(msgEl);
        chatInput.value = "";
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    // -------- REQUEST LOGIC --------
    async function loadRequests() {
        const res = await fetch("/api/requests?status=NEW");
        const data = await res.json();
        const table = document.getElementById("requestsTable");
        table.innerHTML = "";
        data.forEach(r => {
            const isPromo = r.description.includes('🎁');
            const row = `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-3 py-2">${r.id}</td>
                <td class="px-3 py-2"><i class="fa-solid fa-user"></i> ${r.clientName}</td>
                <td class="px-3 py-2"><i class="fa-solid fa-location-dot"></i> ${r.address}</td>
                <td class="px-3 py-2">${r.description} ${isPromo ? '<span class="bg-yellow-200 text-yellow-800 px-1 rounded ml-1 font-semibold">АКЦИЯ</span>' : ''}</td>
                <td class="px-3 py-2">
                    <span class="status-badge ${
                        r.status==='NEW'?'bg-yellow-200 text-yellow-800':
                        r.status==='IN_PROGRESS'?'bg-blue-200 text-blue-800':
                        r.status==='DONE'?'bg-green-200 text-green-800':'bg-gray-200 text-gray-600'
                    }">${r.status}</span>
                </td>
                <td class="px-3 py-2">${r.assignedTo ? `<i class="fa-solid fa-hard-hat"></i> ${r.assignedTo.name}`:'-'}</td>
                <td class="px-3 py-2 flex gap-2">
                    <button class="bg-green-500 hover:bg-green-600 text-white px-2 py-1 rounded" onclick="assign(${r.id})">Назначить</button>
                    <button class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded" onclick="cancel(${r.id})">Отменить</button>
                </td>
            </tr>`;
            table.innerHTML += row;
        });
    }

    async function assign(requestId) {
        const masterId = 1;
        await fetch(`/take/${requestId}/${masterId}`, { method: "POST" });
        loadRequests();
    }

    async function cancel(requestId) {
        await fetch(`/api/requests/${requestId}/cancel`, { method: "POST" });
        loadRequests();
    }

    document.getElementById("requestForm").addEventListener("submit", async e => {
        e.preventDefault();
        const form = e.target;
        const data = {
            clientName: form.clientName.value,
            phone: form.phone.value,
            address: form.address.value,
            description: form.description.value
        };
        if(!data.description.includes('🎁')) data.description += ' 🎁 Акция: первый вызов бесплатно!';
        await fetch("/api/requests", {
            method:"POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(data)
        });
        form.reset();
        loadRequests();
    });

    loadRequests();
</script>

</body>
</html>
